<!DOCTYPE html>
<html>
<head>   
    <title>Brain Viz Chat Test</title>
    <style>
        body {font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        #chat-box {border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px;}
        .user-msg {text-align: right; color: blue; margin: 5px 0;}
        .assistant-msg {text-align: left; color: green; margin: 5px 0;}
        input, button {padding: 8px; font-size: 14px;}
        #message-input {width: 70%;}
    </style>
</head>
<body>
    <h2>Brain Viz Chat Test</h2>
    <div id="chat-box"></div>
    <input type="text" id="message-input" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        let conversationId = null

        async function startConversation() {
            const response = await fetch('http://127.0.0.1:8000/new-conversation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'},
                body: JSON.stringify({name: 'Browser Test Chat'})
            });
            const data =  await response.json()
            conversationId =  data.id;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value;    
            if (!message) return;
            
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="user-msg">${message}</div>`;
            input.value = '';

            const response = await fetch('http://127.0.0.1:8000/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: message, conversation_id : conversationId})
            })
            const data = await response.json()
            chatBox.innerHTML += `<div class="assistant-msg">${data.reply}</div>`
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        startConversation();

        document.getElementById('message-input').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
                }
        });
    </script>
</body>
</html>
